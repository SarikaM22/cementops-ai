version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: cementops_db
    environment:
      POSTGRES_DB: cementops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cementops2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: cementops_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cementops
      DB_USER: postgres
      DB_PASS: cementops2024
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/models:/app/models

  simulator:
    build: ./backend
    container_name: cementops_simulator
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cementops
      DB_USER: postgres
      DB_PASS: cementops2024
    command: ["python", "simulator.py"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: cementops_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:

  